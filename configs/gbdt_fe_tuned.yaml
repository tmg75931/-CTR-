# 토스광고 CTR 정형 파생 피처(FE) + 다중 백엔드 GBDT(LightGBM/CatBoost/XGBoost) 튜닝 설정
paths:
  train_path: "/content/drive/MyDrive/toss_ctr/data/processed/train_tabular_diet.parquet"
  test_path: "/content/drive/MyDrive/toss_ctr/data/processed/test_tabular_diet.parquet"
  folds_path: "/content/drive/MyDrive/toss_ctr/data/processed/folds.parquet"
  seq_summary_train: "/content/drive/MyDrive/toss_ctr/data/processed/train_seq_summary.parquet"
  seq_summary_test: "/content/drive/MyDrive/toss_ctr/data/processed/test_seq_summary.parquet"
  preds_dir: "/content/drive/MyDrive/toss_ctr/data/processed/predictions"
  reports_dir: "/content/drive/MyDrive/toss_ctr/reports"

seed: 42

features:
  interaction_pairs:
    - ["inventory_id", "l_feat_14"]
    - ["inventory_id", "hour"]
    - ["age_group", "gender"]
    - ["day_of_week", "hour"]
    - ["inventory_id", "age_group"]
    - ["inventory_id", "gender"]
    - ["l_feat_14", "hour"]
  interaction_format: "hash_int64"
  add_row_stats: true
  add_cyclical_hour: true
  freq_encode_cols:
    - "inventory_id"
    - "l_feat_14"
    - "age_group"
    - "gender"
    - "hour"
    - "day_of_week"
    - "seq_last_1"
  include_interactions_in_freq: true
  add_freq_log1p: true
  conditional_pair_specs:
    - ["inventory_id", "l_feat_14"]
    - ["l_feat_14", "inventory_id"]
    - ["inventory_id", "hour"]
  target_encode_cols:
    - "inventory_id"
    - "l_feat_14"
    - "age_group"
    - "gender"
    - "hour"
    - "seq_last_1"
  include_interactions_in_te: true
  te_smoothing: 20.0
  te_handle_missing: "encode"

models:
  lgbm_fe_tuned:
    backend: "lightgbm"
    model_name: "lgbm_fe_tuned"
    weighting_mode: "balanced_weight"
    use_50_50_weight: true
    target_pos_rate: 0.5
    test_agg: "logit_mean"
    early_stopping_rounds: 100
    seed: 42
    categorical_features:
      - "gender"
      - "age_group"
      - "inventory_id"
      - "day_of_week"
      - "hour"
      - "l_feat_14"
    params:
      objective: "binary"
      metric: "binary_logloss"
      boosting_type: "gbdt"
      learning_rate: 0.03
      num_leaves: 127
      n_estimators: 3000
      min_child_samples: 200
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.7
      reg_alpha: 2.0
      reg_lambda: 10.0
      max_bin: 255
      n_jobs: -1
      verbose: -1

  catboost_fe_tuned:
    backend: "catboost"
    model_name: "catboost_fe_tuned"
    weighting_mode: "balanced_weight"
    use_50_50_weight: true
    target_pos_rate: 0.5
    test_agg: "logit_mean"
    early_stopping_rounds: 100
    seed: 42
    categorical_features:
      - "gender"
      - "age_group"
      - "inventory_id"
      - "day_of_week"
      - "hour"
      - "l_feat_14"
    params:
      loss_function: "Logloss"
      eval_metric: "Logloss"
      iterations: 3000
      learning_rate: 0.05
      depth: 6
      l2_leaf_reg: 5.0
      random_strength: 1.0
      verbose: 200

  xgb_fe_tuned:
    backend: "xgboost"
    model_name: "xgb_fe_tuned"
    weighting_mode: "balanced_weight"
    use_50_50_weight: true
    target_pos_rate: 0.5
    test_agg: "logit_mean"
    early_stopping_rounds: 100
    seed: 42
    categorical_features:
      - "gender"
      - "age_group"
      - "day_of_week"
      - "hour"
    params:
      objective: "binary:logistic"
      eval_metric: "logloss"
      learning_rate: 0.03
      max_depth: 7
      n_estimators: 3000
      min_child_weight: 50
      subsample: 0.8
      colsample_bytree: 0.7
      reg_alpha: 2.0
      reg_lambda: 10.0
      tree_method: "hist"
      n_jobs: -1
